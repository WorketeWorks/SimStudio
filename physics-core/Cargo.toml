[package]
name = "sim-studio-physics"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["simd"]
# Rapier 0.35 exposes its portable packed solver through the simd8 feature.
# The wasm build also enables the target's simd128 instructions in .cargo/config.toml.
simd = ["rapier3d/simd8"]

[dependencies]
js-sys = "0.3.90"
rapier3d = { version = "0.35.2", default-features = true }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.127"

[dev-dependencies]
serde_json = "1.0.149"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
