[package]
name = "sim-studio-render"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
console_error_panic_hook = "0.1"
js-sys = "0.3.90"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wgpu = { version = "29.0.0", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3.90", features = [
  "Document",
  "HtmlCanvasElement",
  "Navigator",
  "Window",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
